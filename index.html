<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Elva Valla Kultuuriekraan</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --elva-blue: #315efb;
            --elva-blue-dark: #2147d9;
            --accent-green: #22c55e;

            --bg-black: #05070c;
            --card-black: rgba(10, 14, 24, 0.88);
            --card-elevated: rgba(15, 20, 34, 0.88);
            --text-white: #ffffff;
            --muted: #9fb0c9;
            --soft-text: #d7e1f1;
            --border: rgba(255, 255, 255, 0.12);

            --header-h: 12vh;
            --ticker-h: 15vh;
            --safe-area: 5vw;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(49, 94, 251, 0.10), transparent 32%),
                radial-gradient(circle at top right, rgba(255, 255, 255, 0.05), transparent 28%),
                linear-gradient(180deg, #07101e 0%, #05070c 100%);
            color: var(--text-white);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0 var(--safe-area);
            text-shadow: 0 1px 2px rgba(0,0,0,0.18);
            transition: background 0.8s ease, color 0.8s ease;
        }

        body.theme-day {
            --bg-black: #eef4fb;
            --card-black: rgba(255, 255, 255, 0.78);
            --card-elevated: rgba(255, 255, 255, 0.92);
            --text-white: #13213b;
            --muted: #4f5f7d;
            --soft-text: #283754;
            --border: rgba(87, 113, 167, 0.18);
            background:
                radial-gradient(circle at top left, rgba(49, 94, 251, 0.10), transparent 35%),
                radial-gradient(circle at top right, rgba(49, 94, 251, 0.05), transparent 32%),
                linear-gradient(180deg, #edf3fb 0%, #e8eef8 100%);
            text-shadow: none;
        }

        #ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            filter: brightness(0.22) blur(90px) saturate(1.08);
            opacity: 0.85;
            transition: background-image 1.5s ease-in-out, filter 0.8s ease, opacity 0.8s ease;
            transform: scale(1.2);
        }

        body.theme-day #ambient-bg {
            filter: brightness(0.72) blur(100px) saturate(1.02);
            opacity: 0.28;
        }

        header {
            height: var(--header-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 2vh;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.4vw;
        }

        .elva-logo {
            width: 3.5vw;
            height: 3.5vw;
            min-width: 3.5vw;
            background: linear-gradient(180deg, var(--elva-blue), var(--elva-blue-dark));
            color: #ffffff;
            border-radius: 18%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 2vw;
            line-height: 1;
            box-shadow: 0 10px 22px rgba(49, 94, 251, 0.28);
        }

        .header-title {
            font-size: 1.6vw;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2.2px;
            color: var(--text-white);
            opacity: 0.92;
        }

        .clock-section {
            text-align: right;
        }

        .clock {
            font-size: 3.8vw;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .date-today {
            font-size: 1.3vw;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            margin-top: 5px;
        }

        .app-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2vh 0;
            gap: 2vh;
            min-height: 0;
        }

        .hero {
            flex: 1;
            background: var(--card-black);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 2.3vw;
            position: relative;
            display: flex;
            overflow: hidden;
            box-shadow: 0 24px 64px rgba(15, 23, 42, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.22);
            min-height: 0;
            transition: background 0.8s ease, border-color 0.8s ease, box-shadow 0.8s ease;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 0.9vh;
            background: linear-gradient(90deg, var(--elva-blue), #567dff);
            width: 0;
            z-index: 10;
        }

        #hero-inner {
            display: flex;
            width: 100%;
            height: 100%;
            transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
            position: relative;
            z-index: 1;
        }

        .hero-info {
            flex: 1;
            padding: 3.6vw 3.2vw 3.6vw 3.8vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .hero-date-tag {
            background: linear-gradient(180deg, #416cff, #2d57f2);
            color: #ffffff;
            padding: 0.8vw 2vw;
            border-radius: 50px;
            font-size: 1.3vw;
            font-weight: 800;
            margin-bottom: 2.3vh;
            display: inline-block;
            align-self: flex-start;
            box-shadow: 0 10px 24px rgba(49, 94, 251, 0.20);
        }

        .hero-title {
            font-size: 3.2vw;
            font-weight: 900;
            line-height: 1.08;
            margin-bottom: 2vh;
            color: var(--text-white);
            word-wrap: break-word;
            letter-spacing: -0.04em;
        }

        .hero-loc {
            font-size: 1.8vw;
            font-weight: 800;
            color: var(--accent-green);
            margin-bottom: 2vh;
        }

        .hero-desc {
            font-size: 1.5vw;
            line-height: 1.5;
            color: var(--soft-text);
            font-weight: 600;
            max-width: 95%;
            max-height: 11.5em;
            overflow: hidden;
            position: relative;
        }

        .hero-desc-inner {
            display: block;
            will-change: transform;
            white-space: pre-line;
        }

        .hero-desc-inner.scroll-needed {
            animation-name: descScroll;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes descScroll {
            from { transform: translateY(0); }
            to { transform: translateY(var(--scroll-distance, 0px)); }
        }

        .hero-visual {
            flex: 0 0 46%;
            padding: 3.6vw 3.8vw 3.6vw 1.2vw;
            display: flex;
            align-items: stretch;
            justify-content: center;
        }

        .visual-stage {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 1.8vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .hero-image {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent;
        }

        .bottom-section {
            height: var(--ticker-h);
            display: flex;
            gap: 2vw;
            padding-bottom: 4vh;
            align-items: stretch;
            min-height: 0;
            flex-shrink: 0;
        }

        .ticker-scroll {
            flex: 1;
            display: flex;
            gap: 1.5vw;
            overflow-x: auto;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }

        .ticker-scroll::-webkit-scrollbar { display: none; }

        .event-card {
            flex: 0 0 24vw;
            height: 100%;
            background: var(--card-elevated);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.35vw;
            display: flex;
            align-items: center;
            padding: 1vw;
            gap: 1.2vw;
            cursor: pointer;
            overflow: hidden;
        }

        .event-card.active {
            border: 2px solid rgba(49, 94, 251, 0.78);
            background: linear-gradient(180deg, rgba(49, 94, 251, 0.10), rgba(49, 94, 251, 0.06));
        }

        .event-card-img {
            width: 4.5vw;
            height: 4.5vw;
            border-radius: 0.78vw;
            object-fit: cover;
            flex-shrink: 0;
        }

        .event-card-info {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 0.3vw;
            flex: 1;
            min-width: 0;
        }

        .event-card-date {
            font-size: 0.85vw;
            color: var(--elva-blue);
            font-weight: 800;
            text-transform: uppercase;
        }

        .event-card-title {
            font-size: 1.05vw;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-white);
        }

        .qr-area {
            width: 25vw;
            background: var(--card-elevated);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.7vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8vw 1.6vw 0.8vw 2vw;
            gap: 1.3vw;
            flex-shrink: 0;
        }

        .qr-text {
            font-size: 1vw;
            font-weight: 900;
            text-align: right;
            line-height: 1.15;
            color: var(--text-white);
            flex: 1;
        }

        .qr-box {
            background: #ffffff;
            padding: 0.45vw;
            border-radius: 0.95vw;
            height: 6vw;
            width: 6vw;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #qr-target img, #qr-target canvas {
            max-width: 100%;
            max-height: 100%;
        }

        /* HELI OVERLAY DIALOOG */
        .heli-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 12, 0.88);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .heli-modal {
            background: var(--card-elevated);
            border: 1px solid var(--border);
            padding: 3vw;
            border-radius: 2vw;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .heli-modal h2 {
            font-size: 1.8vw;
            font-weight: 900;
            margin-bottom: 1.5vh;
            color: #fff;
        }

        .heli-modal p {
            font-size: 1vw;
            color: var(--muted);
            margin-bottom: 3.5vh;
            font-weight: 600;
            line-height: 1.4;
        }

        .heli-actions {
            display: flex;
            gap: 1vw;
            justify-content: center;
        }

        .btn-heli {
            padding: 1vw 2vw;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1vw;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-heli-primary {
            background: var(--elva-blue);
            color: #fff;
        }

        .btn-heli-primary:hover {
            background: var(--elva-blue-dark);
            transform: scale(1.03);
        }

        .btn-heli-secondary {
            background: rgba(255,255,255,0.1);
            color: var(--soft-text);
        }

        .loader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3vw;
            font-weight: 900;
            color: var(--elva-blue);
            flex-direction: column;
            text-align: center;
        }
    </style>
</head>

<body>

<audio id="taustamuusika" preload="auto"></audio>

<div id="ambient-bg"></div>

<!-- TAUSTAHELI KÜSIME DIALOOG -->
<div id="heli-overlay" class="heli-overlay">
    <div class="heli-modal">
        <h2>TAUSTAMUUSIKA</h2>
        <p>Kas soovite käivitada ekraani taustamuusika (tugevus 1%)?</p>
        <div class="heli-actions">
            <button class="btn-heli btn-heli-primary" onclick="enableAudioAndStart()">JAH, KÄIVITA HELI</button>
            <button class="btn-heli btn-heli-secondary" onclick="disableAudio()">EI SOOVI HELI</button>
        </div>
    </div>
</div>

<div id="loader" class="loader">
    LAEN ANDMEID...
    <div id="loader-error" style="font-size: 1.2vw; color: #64748b; margin-top: 2vh;">Ootan Kultuuriakna värskeid sündmusi</div>
</div>

<header>
    <div class="header-left">
        <div class="elva-logo">E</div>
        <h1 class="header-title">Kultuuriekraan</h1>
    </div>

    <div class="clock-section">
        <div class="clock" id="clock">00:00</div>
        <div class="date-today" id="today-date">...</div>
    </div>
</header>

<main class="app-content" id="app-main" style="visibility: hidden;">
    <section class="hero">
        <div class="progress-bar" id="progress-bar"></div>
        <div id="hero-inner"></div>
    </section>

    <div class="bottom-section">
        <div class="ticker-scroll" id="ticker-scroll"></div>

        <div class="qr-area">
            <div class="qr-text">VAATA<br>LÄHEMALT</div>
            <div class="qr-box" id="qr-target"></div>
        </div>
    </div>
</main>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwaYCMKGMsPR9cUHjhmj-MjSM2GilGQU0SZbetueLa7RxGr-ZAC8U6gCe1gf5VTqNDt/exec";
    const BASE_ROTATE_INTERVAL = 20000;
    const PIXELS_PER_SECOND = 28;
    const RELOAD_INTERVAL = 1800000;
    const TIME_ZONE = "Europe/Tallinn";

    let events = [];
    let currentIndex = 0;
    let rotationTimer = null;

    // -------- TAUSTAMUUSIKA (1% HELITUGEVUS & PLAYLIST LOOP) --------
    const playlist = [
      "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3",
      "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3",
      "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3"
    ];
    let currentTrackIndex = 0;
    let audioEnabled = false;

    function initAudio() {
        const audio = document.getElementById("taustamuusika");
        if (!audio) return;
        audio.volume = 0.01; // Fikseeritud 1% helitugevus

        audio.onended = function() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            playCurrentTrack();
        };
    }

    function playCurrentTrack() {
        const audio = document.getElementById("taustamuusika");
        if (!audio || !audioEnabled) return;
        
        audio.src = playlist[currentTrackIndex];
        audio.volume = 0.01;
        audio.play().catch(e => console.warn("Heli mängimine takistatud:", e));
    }

    function enableAudioAndStart() {
        audioEnabled = true;
        document.getElementById("heli-overlay").style.display = "none";
        initAudio();
        playCurrentTrack();
    }

    function disableAudio() {
        audioEnabled = false;
        document.getElementById("heli-overlay").style.display = "none";
    }

    // -------- KELL & TEEMA --------
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent = new Intl.DateTimeFormat('et-EE', {
            hour: '2-digit', minute: '2-digit', timeZone: TIME_ZONE
        }).format(now);

        const dateText = new Intl.DateTimeFormat('et-EE', {
            weekday: 'long', day: 'numeric', month: 'long', timeZone: TIME_ZONE
        }).format(now);

        document.getElementById('today-date').textContent = dateText.charAt(0).toUpperCase() + dateText.slice(1);
    }

    function updateThemeByTime() {
        const hour = Number(new Intl.DateTimeFormat('et-EE', { hour: '2-digit', hour12: false, timeZone: TIME_ZONE }).format(new Date()).replace(/\D/g, ''));
        const isDay = hour >= 7 && hour < 21;
        document.body.classList.toggle('theme-day', isDay);
    }

    setInterval(updateClock, 1000);
    setInterval(updateThemeByTime, 60000);
    updateClock();
    updateThemeByTime();

    // -------- SÜNDMUSED & LOOGIKA --------
    async function loadData() {
        try {
            const res = await fetch(`${SCRIPT_URL}?format=json&t=${Date.now()}`, { cache: 'no-store' });
            const data = await res.json();
            if (data.ok && Array.isArray(data.events) && data.events.length > 0) {
                events = data.events;
            } else {
                events = [];
            }
        } catch (e) {
            events = [];
        }
        processData();
    }

    function processData() {
        const loader = document.getElementById('loader');
        const appMain = document.getElementById('app-main');

        if (events.length > 0) {
            loader.style.display = 'none';
            appMain.style.visibility = 'visible';
            renderTicker();
            showEvent(currentIndex || 0);
        } else {
            appMain.style.visibility = 'hidden';
            loader.style.display = 'flex';
        }
    }

    function renderTicker() {
        const ticker = document.getElementById('ticker-scroll');
        ticker.innerHTML = events.map((ev, i) => `
            <div class="event-card" id="card-${i}" onclick="currentIndex=${i}; showEvent(${i});">
                ${ev.img ? `<img src="${ev.img}" class="event-card-img">` : ''}
                <div class="event-card-info">
                    <div class="event-card-date">${formatCardDate(ev.startIso)}</div>
                    <div class="event-card-title">${ev.title || 'Üritus'}</div>
                </div>
            </div>
        `).join('');
    }

    function showEvent(idx) {
        if (!events || events.length === 0) return;
        currentIndex = idx;
        const ev = events[idx];
        const inner = document.getElementById('hero-inner');

        inner.style.opacity = 0;

        setTimeout(() => {
            document.querySelectorAll('.event-card').forEach(c => c.classList.remove('active'));
            const activeCard = document.getElementById(`card-${idx}`);
            if (activeCard) {
                activeCard.classList.add('active');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            inner.innerHTML = `
                <div class="hero-info">
                    <div class="hero-date-tag">${formatIsoDate(ev.startIso)}</div>
                    <h2 class="hero-title">${ev.title || ''}</h2>
                    <div class="hero-loc">📍 ${ev.loc || 'Elva vald'}</div>
                    <div class="hero-desc"><span class="hero-desc-inner">${ev.desc || ''}</span></div>
                </div>
                <div class="hero-visual">
                    <div class="visual-stage">
                        ${ev.img ? `<img src="${ev.img}" class="hero-image">` : ''}
                    </div>
                </div>
            `;

            updateQrCode(ev.url);
            calculateAndStartRotation();
            inner.style.opacity = 1;
        }, 300);
    }

    function calculateAndStartRotation() {
        if (rotationTimer) clearTimeout(rotationTimer);

        const box = document.querySelector('.hero-desc');
        const inner = document.querySelector('.hero-desc-inner');
        let duration = BASE_ROTATE_INTERVAL;

        if (box && inner) {
            const overflow = inner.scrollHeight - box.clientHeight;
            if (overflow > 8) {
                const scrollTimeMs = (overflow / PIXELS_PER_SECOND) * 1000;
                duration = Math.min(Math.max(scrollTimeMs + 4500, BASE_ROTATE_INTERVAL), 45000);

                inner.style.setProperty('--scroll-distance', `-${overflow}px`);
                inner.style.animationDuration = `${scrollTimeMs}ms`;
                setTimeout(() => inner.classList.add('scroll-needed'), 2500);
            }
        }

        const pb = document.getElementById('progress-bar');
        if (pb) {
            pb.style.animation = 'none';
            void pb.offsetWidth;
            pb.style.animation = `progress ${duration}ms linear forwards`;
        }

        rotationTimer = setTimeout(() => {
            currentIndex = (currentIndex + 1) % events.length;
            showEvent(currentIndex);
        }, duration);
    }

    function formatIsoDate(iso) {
        if (!iso) return "Kuupäev puudub";
        const d = new Date(iso);
        return `${d.toLocaleDateString('et-EE', { weekday: 'long', day: 'numeric', month: 'long' })} | kell ${d.toLocaleTimeString('et-EE', { hour: '2-digit', minute: '2-digit' })}`;
    }

    function formatCardDate(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        return `${d.toLocaleDateString('et-EE', { day: 'numeric', month: 'short' })} · ${d.toLocaleTimeString('et-EE', { hour: '2-digit', minute: '2-digit' })}`;
    }

    function updateQrCode(url) {
        const target = document.getElementById("qr-target");
        if (!target) return;
        target.innerHTML = "";
        new QRCode(target, { text: url || "https://kultuuriaken.tartu.ee", width: 150, height: 150 });
    }

    loadData();
    setInterval(loadData, RELOAD_INTERVAL);
</script>

</body>
</html>
